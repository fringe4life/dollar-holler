name: Setup app
description: Bun install, Varlock test env, optional svelte-kit sync

inputs:
  svelte-kit-sync:
    description: Run svelte-kit sync after Varlock loads (needed for ESLint / $app)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    # Install first so @varlock/bitwarden-plugin is available.
    # --ignore-scripts skips prepare (svelte-kit sync) until env is loaded.
    - run: bun install --frozen-lockfile --ignore-scripts
      shell: bash

    - name: Load environment variables
      uses: dmno-dev/varlock-action@v1.0.5

    - name: Sync SvelteKit
      if: inputs.svelte-kit-sync == 'true'
      run: bun x svelte-kit sync
      shell: bash
