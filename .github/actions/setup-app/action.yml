name: Setup app
description: Bun install, Varlock test env, optional svelte-kit sync

inputs:
  svelte-kit-sync:
    description: Run svelte-kit sync after Varlock loads (needed for ESLint / $app)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    # Registry tarball cache (not secrets). Keyed on bun.lock so #238 CD can
    # restore the same tree without promoting PR/test-env *build* artifacts.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    # Install first so @varlock/bitwarden-plugin is available.
    # --ignore-scripts skips prepare (svelte-kit sync) until env is loaded.
    - run: bun install --frozen-lockfile --ignore-scripts
      shell: bash

    - name: Load environment variables
      # Pin to commit (Sonar: avoid floating tag installs).
      uses: dmno-dev/varlock-action@7141115d0060616e398c5fa9035e67d7820ab2b6 # v1.0.5

    - name: Sync SvelteKit
      if: inputs.svelte-kit-sync == 'true'
      # Local binary (lockfile); avoid `bun x` — Sonar githubactions:S8543.
      run: ./node_modules/.bin/svelte-kit sync
      shell: bash
