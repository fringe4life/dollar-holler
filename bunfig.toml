[install]
linker = "isolated"
minimumReleaseAge=259200
# and their fresh transitive. Drop excludes once pins are ≥3 days old (2026-11-04+).
minimumReleaseAgeExcludes = [
  "ogygia",
  "@ogygia/core",
  "@ogygia/devtools",
  "@ogygia/router",
  "vite"
]

# Varlock: disable Bun’s automatic `.env` loading so resolution order matches the schema (see https://varlock.dev/integrations/bun/).
env = false

preload = ["varlock/auto-load"]

# `bun test` ignores the runtime preload and only uses this list.
# Varlock must run after VARLOCK_ENV is set (see app-env-preload).
[test]
preload = ["./src/test/app-env-preload.ts", "varlock/auto-load"]
