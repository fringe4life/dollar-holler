# Daily version updates. Ecosystems: Bun (package.json + bun.lock) and GitHub Actions.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    # Families that share a core or an exact/peer version line. Split PRs
    # (#327 then #343) left svelte-kit sync unable to load vite.config.
    groups:
      ogygia:
        patterns:
          - "ogygia"
          - "@ogygia/*"
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      alchemy:
        patterns:
          - "alchemy"
          - "@alchemy.run/*"
      pandacss:
        patterns:
          - "@pandacss/*"
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"

  # SHA-pinned `uses: owner/action@<commit> # vX.Y.Z` stay SHA-to-SHA; Dependabot
  # also rewrites the trailing version comment. There is no public dependabot.yml
  # key to *convert* tags to SHAs — pin in YAML first (this repo does).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
