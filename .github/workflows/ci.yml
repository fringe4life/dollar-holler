name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Mondays 09:00 UTC — catch advisories published against an unchanged lockfile
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Include event_name so Monday cron does not cancel a simultaneous push to main
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      # Use test env + .env.test dummy literals — no Bitwarden machine account in CI
      VARLOCK_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: $/.github/actions/setup-app
        with:
          svelte-kit-sync: "true"

      - name: ESLint
        run: bun run lint

      - name: Prettier
        run: bun run format:check

      - name: Stylelint
        run: bun run stylelint

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VARLOCK_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: $/.github/actions/setup-app

      # styled-system/ is gitignored. bun run check does not generate it.
      - name: Typecheck
        run: bun run typecheck

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VARLOCK_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: $/.github/actions/setup-app

      - name: Unit tests
        run: bun run test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # bun.lock only — no install / Varlock needed
      - name: Lockfile dedupe check
        run: bun run dedupe:check

      - name: Dependency audit (prod, moderate+)
        run: bun run audit:deps
