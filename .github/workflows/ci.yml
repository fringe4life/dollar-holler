name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Mondays 09:00 UTC — catch advisories published against an unchanged lockfile
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Include event_name so Monday cron does not cancel a simultaneous push to main
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Use test env + .env.test dummy literals — no Bitwarden machine account in CI
      VARLOCK_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          svelte-kit-sync: "true"

      - name: ESLint
        run: bun run lint

      - name: Prettier
        run: bun run format:check

      - name: Stylelint
        run: bun run stylelint

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      VARLOCK_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app

      # styled-system/ is gitignored. bun run check does not generate it.
      - name: Typecheck
        run: bun run typecheck

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      VARLOCK_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup app
        uses: ./.github/actions/setup-app

      - name: Unit tests
        run: bun run test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun audit reads bun.lock only — no install / Varlock needed
      - name: Dependency audit (prod, moderate+)
        run: bun run audit:deps
