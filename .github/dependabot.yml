# Daily version updates. Ecosystems: Bun (package.json + bun.lock) and GitHub Actions.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10

  # SHA-pinned `uses: owner/action@<commit> # vX.Y.Z` stay SHA-to-SHA; Dependabot
  # also rewrites the trailing version comment. There is no public dependabot.yml
  # key to *convert* tags to SHAs — pin in YAML first (this repo does).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
